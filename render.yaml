# Render Blueprint -- deploys the web service + a free Postgres database
# together in one step. In the Render dashboard: New -> Blueprint -> point
# it at this repo. See saas/OPERATIONS.md for the full walkthrough.
databases:
  - name: artvion-db
    plan: free

services:
  - type: web
    name: artvion-football-tips
    runtime: python
    plan: free
    rootDir: saas
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: artvion-db
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FREE_DAILY_LIMIT
        value: "3"
